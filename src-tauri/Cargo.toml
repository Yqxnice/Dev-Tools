[package]
name = "dev_tools"
version = "1.0.1"
description = "Dev Tools - Windows 本地开发环境管理工具（MySQL / Python / JetBrains）"
authors = ["you"]
edition = "2021"

[lib]
name = "dev_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
  tauri = { version = "2", features = ["tray-icon"] }
  tauri-plugin-shell = "2"
  tauri-plugin-single-instance = "2"
  tauri-plugin-window-state = "2"
  tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "7", features = ["serde-compat"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "time", "fs", "macros"] }
regex = "1"
dirs = "5.0"
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls", "gzip"] }
sha2 = "0.10"
md-5 = "0.10"
futures-util = "0.3"
base64 = "0.22"
check_elevation = "0.2.7"
thiserror = "1"
windows = { version = "0.58", features = ["Win32_System_Services", "Win32_System_Registry", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_SystemInformation"] }
